services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loyalty
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loyalty
      SPRING_DATASOURCE_USERNAME: loyalty
      SPRING_DATASOURCE_PASSWORD: loyalty
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-course-project-demo-secret-key-which-is-long-enough-for-hmac-sha256}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-demo-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-demo-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  postgres-data:
